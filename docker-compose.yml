# One-command local stack: Flask app + Keycloak.
# Note: you still need to create the `zerotrust` realm, `zt-app` client, and a
# test user in Keycloak for the JWT-protected routes (see README / run.sh).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
  app:
    build: .
    environment:
      KEYCLOAK_URL: "http://keycloak:8080"
      HOST: "0.0.0.0"
      PORT: "5001"
    ports:
      - "5001:5001"
    depends_on:
      - keycloak
